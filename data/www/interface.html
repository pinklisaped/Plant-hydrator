<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydration config</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="container">
        <div class="form-spill">
            <form class="form-spill" method="POST" action="/spill">
                <button type="submit">Spill 💦</button>
            </form>
        </div>
        <h1>Configuration</h1>
        <form class="config-form" method="POST" action="/save_config">
            <div class="form-group">
                <label for="interval">Interval:</label>
                <select name="interval" id="interval">
                    <option value="300">5 minutes</option>
                    <option value="600">10 minutes</option>
                    <option value="900">15 minutes</option>
                    <option value="1800">30 minutes</option>
                    <option value="3600">1 hour</option>
                    <option value="7200">2 hours</option>
                    <option value="14400">4 hours</option>
                    <option value="43200">12 hours</option>
                    <option value="64800">18 hours</option>
                    <option value="86400" selected>1 day (24h)</option>
                    <option value="129600">1.5 days (36h)</option>
                    <option value="172800">2 days (48h)</option>
                    <option value="216000">2.5 days (60h)</option>
                    <option value="259200">3 days (72h)</option>
                    <option value="302400">3.5 days (84h)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="duration">Duration (seconds):</label>
                <input type="number" name="duration" id="duration" min="5" max="65535" value="10"
                    placeholder="Hydration duration" required>
            </div>
            <button type="submit">Save 💾</button>
        </form>
    </div>
    <div id="serial" class="serial">N/A</div>

    <script src="common.js"></script>
    <script>
        async function loadConfig() {
            try {
                let response = await fetch('/get_config');
                if (!response.ok) throw new Error("Failed to load config");
                let data = await response.json();
                document.getElementById('interval').value = data.interval || "86400";
                document.getElementById('duration').value = data.duration || "10";
            } catch (error) {
                console.error("Error loading config:", error);
                showPopup("⚠️ The device doesn`t have any config!");
            }
        }

        document.querySelector("form.config-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            let formData = new FormData(event.target);
            let jsonData = {};
            formData.forEach((value, key) => jsonData[key] = value);

            try {
                let response = await fetch('/save_config', {
                    method: "POST",
                    body: new URLSearchParams(jsonData),
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                let resultText = await response.text();
                showPopup(resultText || "✅ Settings were saved!");
            } catch (error) {
                console.error("Error saving config:", error);
                showPopup("⚠️ Saving error!");
            }
        });

        document.querySelector("form.form-spill").addEventListener("submit", async function (event) {
            event.preventDefault();
            try {
                let response = await fetch('/spill', {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                let resultText = await response.text();
                showPopup(resultText || "✅ Success!");
            } catch (error) {
                console.error("Error saving config:", error);
                showPopup("⚠️ Spill error!");
            }
        });

        window.addEventListener('load', loadSerial, false);
        window.addEventListener('load', loadConfig, false);
    </script>
</body>

</html>
